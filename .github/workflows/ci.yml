name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Package Locally
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Universality Suite (36 Synthetic Architecture Checks)
        run: |
          python tests/test_universal.py

      - name: Run Ground-Truth Suite (13 Measured Allocations)
        run: |
          python tests/test_ground_truth.py

      - name: Run Adversarial Audit Suite
        run: |
          python tests/audit.py
