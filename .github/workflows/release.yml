name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller .

      - name: Build Standalone Windows Executable
        run: |
          python build_exe.py

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: toktuner-windows
          path: dist/toktuner.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies (Tkinter / X11)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tcl-dev tk-dev

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller .

      - name: Build Standalone Linux Executable
        run: |
          python build_exe.py
          mv dist/toktuner dist/toktuner-linux-x86_64
          chmod +x dist/toktuner-linux-x86_64

      - name: Upload Linux Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: toktuner-linux
          path: dist/toktuner-linux-x86_64

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: toktuner-windows
          path: release-assets/

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: toktuner-linux
          path: release-assets/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/toktuner.exe
            release-assets/toktuner-linux-x86_64
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
