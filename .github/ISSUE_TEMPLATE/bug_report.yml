name: Bug Report
description: Report unexpected behavior, silent spilling, or miscalculated flags.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please provide the details below so we can reproduce and fix it.

  - type: input
    id: model_name
    attributes:
      label: Model Name & Quantization
      description: What model were you testing? (e.g. Qwen2.5-72B-Instruct-Q4_K_M.gguf)
      placeholder: e.g. DeepSeek-V2-Lite-Chat-Q4_K_M.gguf
    validations:
      required: true

  - type: textarea
    id: hardware_info
    attributes:
      label: Hardware Specifications
      description: Please share your GPU, VRAM, CPU, and RAM.
      placeholder: |
        - GPU: RTX 4090 24GB
        - CPU: AMD Ryzen 9 7950X
        - RAM: 64GB DDR5
        - OS: Windows 11 / Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: toktuner_output
    attributes:
      label: Generated toktuner Command & Flags
      description: What flags did toktuner emit?
      placeholder: paste command or toktuner output here
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: What Happened?
      description: Describe the unexpected behavior (e.g. OOM, llama-server rejected flag, KV cache spilled to CPU).
    validations:
      required: true
